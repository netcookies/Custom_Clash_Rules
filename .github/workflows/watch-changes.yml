name: Watch Yaml Directory Changes

on:
  push:
    paths:
      - 'cfg/**/*.ini'
      - 'base/template.yaml'
      - '.github/scripts/*.sh'
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  run-custom-scripts:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # 需要完整历史以进行合并

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Run customization script
        run: |
          bash .github/scripts/customize.sh

      - name: Run convert yaml script
        run: |
          bash .github/scripts/convert_yaml.sh

      - name: Validate generated files
        run: |
          bash -n .github/scripts/customize.sh
          bash -n .github/scripts/convert_yaml.sh
          for file in cfg/*.ini; do
            yaml_file="yaml/$(basename "${file%.ini}").yaml"
            test -f "$yaml_file"
          done
          if grep -RInE 'ghfast\.top|gh-proxy\.com' cfg yaml; then
            echo "检测到旧代理域名残留"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git add cfg yaml
          git diff --cached --quiet || git commit -m "chore: regenerate config artifacts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
