;Custom_Clash_Rules
;Stash 全分组模板（Custom_Stash_Full）
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_Clash_Rules
;该订阅模板为 Custom_OpenClash_Rules 项目的衍生项目
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;
;Stash 专用说明：
;1. Stash 的 GEOSITE 固定使用 v2fly/domain-list-community 的 data/<name>，
;   不读取 Clash Meta 的 geox-url / geosite.dat，也不支持 google-cn、gfw、
;   category-games@cn 这些 v2fly 不存在的分类。
;2. 因此下面用 rule-provider 直接引用 MetaCubeX 的单类列表，并用 RULE-SET 替代
;   全部 GEOSITE 规则；DNS fake-ip-filter 也改用 rule-set: 引用 provider。
;   provider 必须是 behavior: domain + format: text。
;3. GEOIP 规则保留，因为 Stash 可以单独配置 MaxMind 格式的 country-lite.mmdb。
;   不要填 V2Ray 格式的 geoip.dat。

; skip_customize=true

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

