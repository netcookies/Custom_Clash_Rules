  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,googlefcm,📢 谷歌FCM
  - GEOSITE,google,🇬 谷歌服务
  - GEOSITE,gfw,🚀 手动选择
  - RULE-SET,hxmovie,🌸 红杏影视
  - GEOSITE,steam,🎮 Steam
  - GEOSITE,category-games,🎮 游戏平台
  - GEOIP,google,🇬 谷歌服务,no-resolve
  - GEOSITE,cn,🎯 全球直连
