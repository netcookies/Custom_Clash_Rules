    include-all: true
    filter: (?i)红杏|红杏云|hongxingdl|hongxing|hongxingyun
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🌀 全部节点
    type: select
    include-all: true

rule-providers:
  hxmovie:
    type: http
    behavior: classical
    path: ./ruleset/hxmovie.yaml
    url: "https://raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/hxmovie.list"
    interval: 28800
    format: text
  custom_direct:
    type: http
    behavior: classical
    path: ./ruleset/custom_direct.yaml
    url: "https://raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/Custom_Direct.list"
    interval: 28800
    format: text
  custom_proxy:
    type: http
    behavior: classical
    path: ./ruleset/custom_proxy.yaml
    url: "https://raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/Custom_Proxy.list"
    interval: 28800
    format: text
  steam_cdn:
    type: http
    behavior: classical
    path: ./ruleset/steam_cdn.yaml
    url: "https://raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/Steam_CDN.list"
    interval: 28800
    format: text

rules:
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  - RULE-SET,custom_direct,🎯 全球直连
  - RULE-SET,custom_proxy,🚀 手动选择
  - GEOSITE,google-cn,🎯 全球直连
  - GEOSITE,category-games@cn,🎯 全球直连
  - RULE-SET,steam_cdn,🎯 全球直连
