    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇳🇱 荷兰节点
    type: url-test
    include-all: true
    filter: (?i)荷兰|Netherlands|阿姆斯特丹
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇹🇷 土耳其节点
