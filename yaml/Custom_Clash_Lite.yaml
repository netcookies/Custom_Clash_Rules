    interval: 300
    tolerance: 50
  - name: 🇨🇦 加拿大节点
    type: url-test
    include-all: true
    filter: (?i)加拿大|Canada|渥太华|温哥华|卡尔加里
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇬🇧 英国节点
    type: url-test
