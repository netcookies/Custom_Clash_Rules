port: 8080
socks-port: 1080
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
external-controller: 0.0.0.0:9090
find-process-mode: off
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
external-ui: ui
external-ui-url: https://cdn.gh-proxy.org/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

tun:
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  mtu: 9000
  gso: true
  gso-max-size: 65536
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - GEOSITE:cn
    - GEOSITE:connectivity-check
    - GEOSITE:private
  fake-ip-filter-mode: blacklist
  use-system-hosts: true
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  proxy-server-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.360.cn/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.360.cn/dns-query

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:
  - name: 🚀 手动选择
    type: select
    include-all: true
  - name: 📢 谷歌FCM
    type: select
    proxies:
      - 🚀 手动选择
      - 🎯 全球直连
  - name: 🇬 谷歌服务
    type: select
    proxies:
      - 🚀 手动选择
      - 🎯 全球直连
  - name: 🚀 测速工具
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 手动选择
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 手动选择
      - 🎯 全球直连
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
  - name: 🌸 红杏影视
    type: url-test
    include-all: true
    filter: (?i)红杏|红杏云|hongxingdl|hongxing|hongxingyun
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

rule-providers:
  custom_direct:
    type: http
    behavior: classical
    path: ./ruleset/custom_direct.yaml
    url: "https://hk.gh-proxy.org/raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/Custom_Direct.list"
    interval: 28800
    format: text
  custom_proxy:
    type: http
    behavior: classical
    path: ./ruleset/custom_proxy.yaml
    url: "https://hk.gh-proxy.org/raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/Custom_Proxy.list"
    interval: 28800
    format: text
  hxmovie:
    type: http
    behavior: classical
    path: ./ruleset/hxmovie.yaml
    url: "https://hk.gh-proxy.org/raw.githubusercontent.com/netcookies/Custom_Clash_Rules/main/rules/hxmovie.list"
    interval: 28800
    format: text

rules:
  - RULE-SET,custom_direct,🎯 全球直连
  - RULE-SET,custom_proxy,🚀 手动选择
  - RULE-SET,hxmovie,🌸 红杏影视
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,cn,🎯 全球直连,no-resolve
  - GEOSITE,google-cn,🎯 全球直连
  - GEOSITE,category-speedtest,🚀 测速工具
  - GEOSITE,googlefcm,📢 谷歌FCM
  - GEOSITE,google,🇬 谷歌服务
  - GEOIP,google,🇬 谷歌服务,no-resolve
  - GEOIP,cn,🎯 全球直连
  - MATCH,🐟 漏网之鱼
